[project]
name = "career-compass-backend"
version = "0.1.0"
description = "Career Compass API — FastAPI modular monolith with LangGraph agents"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic[email]>=2.8",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "pyjwt[crypto]>=2.9",
    "argon2-cffi>=23.1",
    "httpx>=0.27",
    "langgraph>=0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "import-linter>=2.1",
]

[tool.uv]
package = false

# ── Tests ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["error::RuntimeWarning"]

# ── Lint / format ────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "SIM", "RUF", "N"]
ignore = [
    "B008", # FastAPI Depends(...) in defaults is the intended pattern
    "N818", # NotFound / Unauthorized read better than NotFoundError here
]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"] # asserts and test passwords are fine in tests
"alembic/**" = ["E501"]

# ── Types ────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions"]

[[tool.mypy.overrides]]
module = ["langgraph.*", "argon2.*", "asyncpg.*"]
ignore_missing_imports = true

# ── Architecture rules (lint-imports) ────────────────────────────────────────
# The modular-monolith boundaries are checked, not just documented.
[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Inside every module: router → service → repository → models (never upward)"
type = "layers"
containers = [
    "app.modules.auth",
    "app.modules.profile",
    "app.modules.chat",
    "app.modules.interview",
    "app.modules.productivity",
]
layers = ["router", "dependencies", "service", "repository", "models"]
exhaustive = false

[[tool.importlinter.contracts]]
name = "Graph module: router → service (its data layer is the shared app.knowledge package)"
type = "layers"
containers = ["app.modules.graph"]
layers = ["router", "dependencies", "service"]

[[tool.importlinter.contracts]]
name = "The knowledge graph never depends on features or agents"
type = "forbidden"
source_modules = ["app.knowledge"]
forbidden_modules = ["app.modules", "app.agents", "app.orchestrator", "app.llm"]

[[tool.importlinter.contracts]]
name = "Core infrastructure never depends on features"
type = "forbidden"
source_modules = ["app.core", "app.db"]
forbidden_modules = [
    "app.modules",
    "app.agents",
    "app.orchestrator",
    "app.memory",
    "app.knowledge",
    "app.llm",
]

[[tool.importlinter.contracts]]
name = "Agents never import each other (they share data through graph state only)"
type = "independence"
modules = [
    "app.agents.resume",
    "app.agents.validation",
    "app.agents.job_search",
    "app.agents.productivity",
    "app.agents.roadmap",
    "app.agents.advisor",
    "app.agents.interview",
]

[[tool.importlinter.contracts]]
name = "Agents never touch the database or HTTP directly"
type = "forbidden"
source_modules = ["app.agents"]
forbidden_modules = ["app.db", "sqlalchemy", "fastapi", "app.modules"]

[[tool.importlinter.contracts]]
name = "Business layer has no HTTP or SQL"
type = "forbidden"
source_modules = [
    "app.modules.auth.service",
    "app.modules.profile.service",
    "app.modules.chat.service",
    "app.modules.graph.service",
    "app.modules.interview.service",
    "app.modules.productivity.service",
]
forbidden_modules = ["fastapi", "sqlalchemy"]
allow_indirect_imports = true  # a service may use another module's public package
