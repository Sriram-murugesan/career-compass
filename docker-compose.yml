# Local Postgres with pgvector (needed for agent memory in Phase 3).
#   docker compose up -d db
#   DATABASE_URL=postgres://career:career@localhost:5432/career_compass
services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: career
      POSTGRES_PASSWORD: career
      POSTGRES_DB: career_compass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U career -d career_compass"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
